name: Vietlott Daily Quant - Private Generate (no public publish)

on:
  schedule:
    # 12:00 ICT (05:00 UTC) daily. Generates plan for internal/private use only.
    - cron: '0 5 * * *'
  workflow_dispatch:

# Do NOT grant contents: write. This workflow must never commit/push SMS commands or reports
# to the repository (publishing commands enables unpaid use and breaks licensing).

jobs:
  generate-daily-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily plan (PRIVATE output)
        env:
          VIETLOTT_OUT_DIR: out/daily
        run: python cloud_daily_runner.py --out-dir out/daily

      - name: Upload private artifact (authorized collaborators only)
        uses: actions/upload-artifact@v4
        with:
          name: vietlott-daily-plan-${{ github.run_id }}
          path: out/daily/
          if-no-files-found: warn
          retention-days: 7

      - name: Security note
        run: |
          echo "Daily SMS commands are sensitive (value)."
          echo "Do not publish artifacts/outputs publicly. Distribute only via the authenticated per-device license server (server/license_server.py)."
